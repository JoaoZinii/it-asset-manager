services:
  db:
    image: postgres:16
    container_name: itam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Arquivos executados na PRIMEIRA criação do volume, em ordem alfabética
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Dados fictícios de demonstração. Para começar só com dados reais, comente a linha abaixo
      # e recrie o banco (docker compose down -v && docker compose up -d).
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
